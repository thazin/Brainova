{% extends "base.html" %}
{% block title %}Edit User{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7">
    <div class="card border-0 shadow-sm">
      <div class="card-body p-4">
        <div class="d-flex align-items-center mb-4 gap-3">
          <a href="{{ url_for('admin.users') }}" class="btn btn-sm btn-outline-secondary">
            <i class="bi bi-arrow-left"></i>
          </a>
          <div class="icon-tile"><i class="bi bi-person-fill-gear"></i></div>
          <div>
            <span class="section-eyebrow"><i class="bi bi-people-fill"></i> User #{{ user['id'] }}</span>
            <h4 class="fw-bold mb-0">Edit User</h4>
          </div>
        </div>

        <form method="POST" action="{{ url_for('admin.edit_user', user_id=user['id']) }}" novalidate>
          <div class="mb-3">
            <label class="form-label fw-semibold">Username</label>
            <input type="text" name="username" class="form-control"
                   value="{{ request.form.get('username', user['username']) }}"
                   minlength="3" required>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Email</label>
            <input type="email" name="email" class="form-control"
                   value="{{ request.form.get('email', user['email']) }}" required>
          </div>

          <div class="mb-4">
            <label class="form-label fw-semibold">New Password
              <span class="text-muted fw-normal small">(leave blank to keep current)</span>
            </label>
            <input type="password" name="new_password" class="form-control"
                   minlength="6" autocomplete="new-password"
                   placeholder="Enter a new password to reset…">
          </div>

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary flex-grow-1">
              <i class="bi bi-check-lg me-2"></i>Save Changes
            </button>
            <a href="{{ url_for('admin.users') }}" class="btn btn-outline-secondary px-4">Cancel</a>
          </div>
        </form>
      </div>
    </div>

    <div class="text-muted small text-center mt-3">
      User ID: {{ user['id'] }} · Joined: {{ user['created_at'][:16] }}
    </div>
  </div>
</div>
{% endblock %}
