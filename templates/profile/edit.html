{% extends "base.html" %}
{% block title %}Edit Profile{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card border-0 shadow-sm">
      <div class="card-body p-4">
        <div class="d-flex align-items-center gap-3 mb-4">
          <div class="icon-tile"><i class="bi bi-pencil-square"></i></div>
          <div>
            <span class="section-eyebrow"><i class="bi bi-person-fill"></i> Account</span>
            <h4 class="fw-bold mb-0">Edit Profile</h4>
          </div>
        </div>

        <form method="POST" action="{{ url_for('profile.edit') }}" novalidate>
          <h6 class="text-muted text-uppercase small fw-semibold mb-3">Account Details</h6>
          <div class="mb-3">
            <label class="form-label fw-semibold">Username</label>
            <input type="text" name="username" class="form-control"
                   value="{{ request.form.get('username', user['username']) }}" required>
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold">Email</label>
            <input type="email" name="email" class="form-control"
                   value="{{ request.form.get('email', user['email']) }}" required>
          </div>

          <hr>
          <h6 class="text-muted text-uppercase small fw-semibold mb-1">Change Password</h6>
          <p class="text-muted small mb-3">Leave blank to keep your current password.</p>

          <div class="mb-3">
            <label class="form-label fw-semibold">Current Password</label>
            <div class="input-group">
              <input type="password" name="current_password" id="curPwd" class="form-control" placeholder="Required to change password">
              <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('curPwd', this)">
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">New Password</label>
            <div class="input-group">
              <input type="password" name="new_password" id="newPwd" class="form-control" placeholder="At least 6 characters">
              <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('newPwd', this)">
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold">Confirm New Password</label>
            <div class="input-group">
              <input type="password" name="confirm_password" id="confPwd" class="form-control" placeholder="Repeat new password">
              <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('confPwd', this)">
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary flex-grow-1">
              <i class="bi bi-check-lg me-2"></i>Save Changes
            </button>
            <a href="{{ url_for('profile.view') }}" class="btn btn-outline-secondary px-4">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
